server {
    listen 8081;
    server_name _;
    root /app/public;
    index index.php;

    client_max_body_size 100M;

    # ==========================================
    # CABECERAS DE SEGURIDAD
    # ==========================================
    # Evita que tu web se cargue en iframes de otros dominios (Clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Fuerzan al navegador a respetar el tipo MIME (Evita ataques MIME-sniffing)
    add_header X-Content-Type-Options "nosniff" always;
    
    # Activa el filtro XSS integrado en los navegadores
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Controla cuánta información se envía en la cabecera Referer al salir de tu web
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # (Opcional pero recomendada) Política de Seguridad de Contenido básica.
    # Permite cargar recursos propios, imágenes externas e ignora scripts de terceros no autorizados.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" always;

    # ==========================================
    # COMPRESIÓN GZIP
    # ==========================================
    gzip on;
    # Nivel de compresión (1-9). El 5 ofrece el mejor equilibrio entre CPU y reducción de tamaño.
    gzip_comp_level 5;
    # No comprimir archivos menores a 256 bytes (cuesta más CPU que el ancho de banda que ahorras)
    gzip_min_length 256;
    # Comprimir respuestas incluso si pasan por proxies (como Cloudflare)
    gzip_proxied any;
    # Añade cabecera Vary para que la caché entienda qué versiones están comprimidas
    gzip_vary on;
    # Tipos de archivos a comprimir (Crucial para los JSON de tu API)
    gzip_types
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # ==========================================
    # ENRUTAMIENTO LARAVEL
    # ==========================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Bloquear acceso a archivos ocultos (como .env o .git) excepto .well-known (para SSL)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}