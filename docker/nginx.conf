server {
    listen 8081;
    server_name _;
    root /app/public;
    index index.php;

    client_max_body_size 100M;

    # ==========================================
    # CABECERAS DE SEGURIDAD
    # ==========================================
    # Evita que tu web se cargue en iframes de otros dominios (Clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Fuerzan al navegador a respetar el tipo MIME (Evita ataques MIME-sniffing)
    add_header X-Content-Type-Options "nosniff" always;
    
    # Activa el filtro XSS integrado en los navegadores
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Controla cuánta información se envía en la cabecera Referer al salir de tu web
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # La Content-Security-Policy ya NO se manda aquí: necesita un nonce
    # distinto en cada petición para los <script> inline (ver
    # app/Http/Middleware/AddContentSecurityPolicyHeader.php), y nginx no
    # puede generar un valor así por petición con esta configuración.

    # ==========================================
    # COMPRESIÓN GZIP
    # ==========================================
    gzip on;
    # Nivel de compresión (1-9). El 5 ofrece el mejor equilibrio entre CPU y reducción de tamaño.
    gzip_comp_level 5;
    # No comprimir archivos menores a 256 bytes (cuesta más CPU que el ancho de banda que ahorras)
    gzip_min_length 256;
    # Comprimir respuestas incluso si pasan por proxies (como Cloudflare)
    gzip_proxied any;
    # Añade cabecera Vary para que la caché entienda qué versiones están comprimidas
    gzip_vary on;
    # Tipos de archivos a comprimir (Crucial para los JSON de tu API)
    gzip_types
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # ==========================================
    # CACHÉ DE ESTÁTICOS
    # ==========================================
    # El service worker de la PWA (public/sw.js) nunca se cachea: si no, las
    # actualizaciones de la app tardarían en llegar a quien ya la tenga
    # instalada en el móvil.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Assets de Vite (public/build/assets/*): el nombre de fichero lleva el
    # hash del contenido, así que un cambio siempre genera una URL nueva —
    # seguro cachearlos "para siempre" sin riesgo de servir una versión vieja.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Carátulas subidas (storage:link -> storage/app/public/covers): mismo
    # razonamiento que /build/, el nombre de fichero es aleatorio y distinto
    # en cada subida o reemplazo (GameController::store()/update()), nunca
    # se reutiliza uno ya existente.
    location ^~ /storage/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Iconos de la PWA y demás estáticos sueltos: sin hash en el nombre, así
    # que un cache "para siempre" dejaría a alguien con un icono viejo si
    # cambia algún día. Una semana es margen de sobra sin pedirlos en cada
    # visita.
    location ~* \.(?:ico|png|jpg|jpeg|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ==========================================
    # ENRUTAMIENTO LARAVEL
    # ==========================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Bloquear acceso a archivos ocultos (como .env o .git) excepto .well-known (para SSL)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}