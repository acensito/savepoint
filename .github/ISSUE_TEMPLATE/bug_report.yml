name: 🐛 Reporte de error
description: Crea un reporte para ayudarnos a mejorar Savepoint.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por tomarte el tiempo de reportar este error! Por favor, completa la siguiente información para que podamos reproducirlo y solucionarlo lo antes posible.
  - type: checkboxes
    id: checks
    attributes:
      label: Comprobaciones previas
      options:
        - label: He buscado en las issues abiertas y cerradas y no he encontrado un reporte duplicado.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Descripción clara del problema
      description: Explica brevemente qué está fallando.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      description: Enumera los pasos exactos que debemos seguir para ver el problema.
      placeholder: |
        1. Ir a '...'
        2. Hacer clic en '....'
        3. Desplazarse hacia abajo hasta '....'
        4. Ver el error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: ¿Qué debería haber ocurrido?
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Comportamiento observado
      description: ¿Qué ocurrió realmente?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Componente afectado
      description: ¿En qué parte de Savepoint ocurre el error?
      options:
        - Colección
        - Lista de deseos
        - Encargos
        - En venta
        - Ventas
        - Estadísticas
        - Catálogo (plataformas, fabricantes, ediciones)
        - Panel de control / Ajustes
        - Autenticación / 2FA
        - Importación / exportación
        - API
        - Docker / despliegue
        - Otro
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit utilizado
      description: ¿Qué versión de Savepoint estás utilizando?
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Método de instalación o despliegue
      options:
        - Docker (perfil servidor)
        - Docker (perfil NAS)
        - Entorno de desarrollo local
        - Otro
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Navegador y dispositivo (si aplica)
      description: Ej. Chrome 120 en Windows 11, Safari en iOS 17.
  - type: textarea
    id: logs
    attributes:
      label: Logs relevantes
      description: Mensajes de error o trazas de la consola/servidor. Se formatean automáticamente como código, no hace falta usar comillas invertidas.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Capturas de pantalla
      description: Arrastra aquí las capturas que ayuden a ver el problema, si aplica.
  - type: checkboxes
    id: sensitive_data
    attributes:
      label: Seguridad de los datos
      options:
        - label: Confirmo que he revisado los logs/capturas y he ocultado contraseñas, tokens y cualquier otra información sensible.
          required: true
