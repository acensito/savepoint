name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, bcmath, gd, zip
          coverage: none

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias de Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias de npm
        run: npm ci

      - name: Compilar assets
        run: npm run build

      - name: Copiar .env y generar APP_KEY
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ejecutar la suite de tests (SQLite en memoria)
        run: php artisan test

  postgres:
    name: Tests (PostgreSQL real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: savepoint_testing
          POSTGRES_USER: savepoint
          POSTGRES_PASSWORD: secreto123
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U savepoint"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, bcmath, gd, zip
          coverage: none

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias de Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias de npm
        run: npm ci

      - name: Compilar assets
        run: npm run build

      - name: Copiar .env y generar APP_KEY
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrar el esquema contra Postgres real
        run: php artisan migrate:fresh --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: savepoint_testing
          DB_USERNAME: savepoint
          DB_PASSWORD: secreto123

      # phpunit.xml fuerza DB_CONNECTION=sqlite (ver #100), así que esta tanda
      # usa phpunit.pgsql.xml, la misma suite con las variables de conexión a
      # Postgres en su lugar. Se llama a phpunit directamente porque
      # "artisan test" ignora --configuration: siempre usa phpunit.xml a pelo.
      - name: Ejecutar la suite de tests (PostgreSQL real)
        run: vendor/bin/phpunit --configuration=phpunit.pgsql.xml --colors=always
