services:
    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        # Lee las credenciales de base de datos directamente desde el .env
        # de la raíz
        env_file:
            - ./.env
        environment:
            # DB_PASSWORD es obligatoria; las demás tienen valores por defecto
            POSTGRES_DB: ${DB_DATABASE:-savepoint}
            POSTGRES_USER: ${DB_USERNAME:-savepoint}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD debe estar definida en .env}
        # Uso personal / concurrencia baja: menos buffers y menos conexiones
        # reservadas que los valores por defecto de la imagen (pensados para
        # servidores con mucho más tráfico que este).
        command: postgres -c shared_buffers=96MB -c max_connections=20 -c work_mem=4MB
        # Perfil "servidor" (por defecto): recursos holgados.
        mem_limit: 512m
        cpus: "1.5"
        # Perfil "NAS" (hardware ajustado, p. ej. un MicroServer N36L
        # compartiendo RAM/CPU con OpenMediaVault y sus plugins): comenta las
        # dos líneas de arriba y descomenta estas dos.
        # mem_limit: 384m
        # cpus: "1.0"
        ports:
            # Cerrado al exterior: Solo accesible desde localhost (tu PC)
            - "127.0.0.1:${POSTGRES_FORWARD_PORT:-5432}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-savepoint}" ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - savepoint_net

    # Backup diario de Postgres (#98): pg_dump -Fc programado con crond,
    # rotación simple de dumps antiguos. Misma imagen que "postgres" a
    # propósito, para que pg_dump sea siempre de la misma versión que el
    # servidor. Los dumps van a una ruta host (BACKUP_PATH) fuera del volumen
    # postgres_data: un "docker compose down -v" o un borrado accidental de
    # ese volumen no se lleva también los backups por delante.
    postgres-backup:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            PGHOST: ${DB_HOST:-postgres}
            PGUSER: ${DB_USERNAME:-savepoint}
            PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD debe estar definida en .env}
            PGDATABASE: ${DB_DATABASE:-savepoint}
            BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
        entrypoint: [ "crond", "-f", "-l", "2" ]
        volumes:
            - ./docker/backup.sh:/docker/backup.sh:ro
            - ./docker/backup-crontab:/etc/crontabs/root:ro
            - ${BACKUP_PATH:-./backups/postgres}:/backups
        mem_limit: 64m
        cpus: "0.1"
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - savepoint_net

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        # AOF (además del snapshot RDB por defecto): sin esto, un crash no
        # limpio podía perder los últimos segundos de sesiones/caché. Bajo
        # riesgo real (nada vive solo aquí, tiene su copia en Postgres),
        # pero el coste de activarlo es nulo. Fsync cada segundo (por defecto,
        # "everysec") en vez de en cada escritura: pérdida máxima de ~1s de
        # datos a cambio de no penalizar el rendimiento en cada operación.
        # --maxmemory con política de desalojo LRU: al ser solo caché/sesiones
        # (con copia real en Postgres) no hay riesgo real en perder claves
        # antiguas bajo presión de memoria; evita que Redis crezca sin límite.
        command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
        # Perfil "servidor" (por defecto):
        mem_limit: 128m
        cpus: "0.5"
        # Perfil "NAS": comenta las dos líneas de arriba y descomenta estas dos.
        # mem_limit: 96m
        # cpus: "0.5"
        ports:
            # Cerrado al exterior: Solo accesible desde localhost
            - "127.0.0.1:${REDIS_FORWARD_PORT:-6379}:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - savepoint_net

    app:
        build:
            context: ./docker
            dockerfile: Dockerfile
        # Mismo nombre de imagen que "queue" (ver más abajo): construyen el
        # mismo Dockerfile/contexto, así que sin esto Compose las trataría como
        # dos imágenes distintas (savepoint-app/savepoint-queue) y las
        # construiría dos veces por separado, el doble de tiempo para nada —
        # con el mismo nombre, se construye una sola vez y "queue" reutiliza
        # esta misma imagen.
        image: >-
            ${COMPOSE_PROJECT_NAME:-savepoint}-app
        restart: unless-stopped
        working_dir: /app
        # Laravel carga el .env de la raíz del repo por su cuenta en cada
        # arranque (dotenv) porque es el mismo .env que Docker Compose usa aquí
        # arriba para sustituir ${DB_DATABASE}/etc. No van como "environment:"
        # del contenedor a propósito: quedarían fijas a nivel de proceso para
        # CUALQUIER comando futuro (incluido "docker compose exec app php
        # artisan test"), y eso rompería el aislamiento de los tests (phpunit.xml
        # fuerza SQLite en memoria, pero perdería esa fuerza si ya hubiera una
        # variable real del contenedor con el mismo nombre). Ver CHANGELOG del
        # 2026-08-06 para el incidente real que causó esto.
        volumes:
            - .:/app
        # Perfil "servidor" (por defecto):
        mem_limit: 512m
        cpus: "1.5"
        # Perfil "NAS": comenta las dos líneas de arriba y descomenta estas dos.
        # mem_limit: 320m
        # cpus: "1.0"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: [ "CMD", "nc", "-z", "127.0.0.1", "9000" ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - savepoint_net

    # Nuevo contenedor para los Jobs de Redis
    queue:
        build:
            context: ./docker
            dockerfile: Dockerfile
        # Ver el comentario en "app": mismo nombre de imagen a propósito, para
        # que se construya una sola vez y este servicio reutilice esa imagen en
        # vez de reconstruirla.
        image: >-
            ${COMPOSE_PROJECT_NAME:-savepoint}-app
        restart: unless-stopped
        working_dir: /app
        # Ejecuta el worker en lugar de PHP-FPM
        command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
        volumes:
            - .:/app
        # Perfil "servidor" (por defecto):
        mem_limit: 256m
        cpus: "0.5"
        # Perfil "NAS": comenta las dos líneas de arriba y descomenta estas dos.
        # mem_limit: 160m
        # cpus: "0.5"
        depends_on:
            app:
                condition: service_healthy
            redis:
                condition: service_healthy
            postgres:
                condition: service_healthy
        networks:
            - savepoint_net

    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            # Desarrollo / testeo: nginx sirve HTTP plano directamente en este
            # puerto (8081 por defecto).
            - "${HTTP_PORT:-8081}:8081"
            # Producción: descomenta esta línea y comenta la de arriba. nginx
            # sigue sirviendo HTTP plano tal cual (los certificados/TLS los pone
            # un proxy inverso delante, que reenvía aquí por HTTP normal) — lo
            # único que cambia es el puerto publicado en el host, 8443 por
            # defecto, para que el proxy inverso apunte ahí.
            # - "${HTTPS_PORT:-8443}:8081"
        volumes:
            - .:/app
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
        # Perfil "servidor" (por defecto):
        mem_limit: 64m
        cpus: "0.25"
        # Perfil "NAS": comenta las dos líneas de arriba y descomenta estas dos.
        # mem_limit: 32m
        # cpus: "0.25"
        depends_on:
            app:
                condition: service_healthy
        networks:
            - savepoint_net

volumes:
    postgres_data:
    redis_data:

networks:
    savepoint_net:
        driver: bridge
