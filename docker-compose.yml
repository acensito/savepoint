services:
  postgres:
    image: postgres:16-alpine
    container_name: savepoint_db
    restart: unless-stopped
    # Lee las credenciales de base de datos directamente desde el .env de la raíz
    env_file:
      - ./.env
    environment:
      # Mantenemos estas como fallback por si el .env no carga a tiempo en el arranque inicial
      POSTGRES_DB: ${DB_DATABASE:-savepoint}
      POSTGRES_USER: ${DB_USERNAME:-savepoint}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secreto123}
    ports:
      # Cerrado al exterior: Solo accesible desde localhost (tu PC)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-savepoint}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - savepoint_net

  redis:
    image: redis:7-alpine
    container_name: savepoint_redis
    restart: unless-stopped
    ports:
      # Cerrado al exterior: Solo accesible desde localhost
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - savepoint_net

  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: savepoint_app
    restart: unless-stopped
    working_dir: /app
    # Laravel carga el .env de la raíz del repo por su cuenta en cada
    # arranque (dotenv) porque es el mismo .env que Docker Compose usa aquí
    # arriba para sustituir ${DB_DATABASE}/etc.: no hay dos ficheros que
    # sincronizar, así que no van como "environment:" del contenedor a
    # propósito. Si lo estuvieran, quedarían fijas a nivel de proceso para
    # CUALQUIER comando futuro (incluido "docker compose exec app php
    # artisan test": el exec hereda el entorno definido aquí, no lo que
    # entrypoint.sh haya tocado en su propio proceso), y eso rompería el
    # aislamiento de los tests (phpunit.xml fuerza SQLite en memoria, pero
    # perdería esa fuerza si ya hubiera una variable real del contenedor con
    # el mismo nombre). Ver CHANGELOG del 2026-08-06 para el incidente real
    # que causó esto la primera vez.
    # ROLE=web: este es el único contenedor que ejecuta el entrypoint con
    # instalación de Laravel + migraciones (ver docker/entrypoint.sh).
    environment:
      ROLE: web
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # El entrypoint corre "migrate" ANTES de lanzar php-fpm, así que si
      # el puerto 9000 responde, las migraciones ya han terminado.
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - savepoint_net

  # Nuevo contenedor para los Jobs de Redis
  queue:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: savepoint_queue
    restart: unless-stopped
    working_dir: /app
    # Ejecuta el worker en lugar de PHP-FPM
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    # Ver el comentario en "app" sobre por qué no hay DB_*/REDIS_HOST aquí.
    environment:
      ROLE: queue
    volumes:
      - .:/app
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - savepoint_net

  nginx:
    image: nginx:alpine
    container_name: savepoint_web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8081}:8081"
      - "${HTTPS_PORT:-8043}:8043"
    volumes:
      - .:/app
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - savepoint_net

volumes:
  postgres_data:
  redis_data:

networks:
  savepoint_net:
    driver: bridge
