services:
  postgres:
    image: postgres:16-alpine
    container_name: savepoint_db
    restart: unless-stopped
    # Lee las credenciales de base de datos directamente desde tu .env de Laravel
    env_file:
      - ./backend/.env
    environment:
      # Mantenemos estas como fallback por si el .env no carga a tiempo en el arranque inicial
      POSTGRES_DB: ${DB_DATABASE:-savepoint}
      POSTGRES_USER: ${DB_USERNAME:-savepoint}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secreto123}
    ports:
      # Cerrado al exterior: Solo accesible desde localhost (tu PC)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-savepoint}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - savepoint_net

  redis:
    image: redis:7-alpine
    container_name: savepoint_redis
    restart: unless-stopped
    ports:
      # Cerrado al exterior: Solo accesible desde localhost
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - savepoint_net

  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: savepoint_app
    restart: unless-stopped
    working_dir: /app
    # Laravel carga backend/.env por su cuenta en cada arranque (dotenv); NO
    # se pasan DB_*/REDIS_HOST como "environment:" del contenedor porque esas
    # variables quedarían fijas a nivel de proceso para CUALQUIER comando
    # futuro (incluido "docker compose exec app php artisan test": el exec
    # hereda el entorno definido aquí, no lo que entrypoint.sh haya tocado
    # en su propio proceso). Eso rompe el aislamiento de tests igual que el
    # env_file que este comentario descartaba antes: PHPUnit fuerza
    # DB_CONNECTION/DB_DATABASE con force="true" en phpunit.xml, pero eso
    # solo pisa el valor que ve env()/config() cuando NO hay ya una variable
    # de entorno real del contenedor con el mismo nombre; si la hay (como
    # pasaba aquí con DB_DATABASE), env() la sigue devolviendo aunque
    # getenv() ya esté forzado a otra cosa, y los tests dejan de usar sqlite
    # en memoria de verdad. Esto ya causó que un "docker compose up" con la
    # base de datos real conectada acabara borrándola (ver CHANGELOG).
    #
    # En su lugar, se monta el .env de la raíz como fichero de solo lectura y
    # entrypoint.sh lo fuente ahí dentro (solo en su propio proceso) para
    # sincronizar backend/.env, que es la única fuente que Laravel consulta
    # en el resto de comandos.
    # ROLE=web: este es el único contenedor que ejecuta el entrypoint con
    # instalación de Laravel + migraciones (ver docker/entrypoint.sh).
    environment:
      ROLE: web
    volumes:
      - ./backend:/app
      - ./.env:/root.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # El entrypoint corre "migrate" ANTES de lanzar php-fpm, así que si
      # el puerto 9000 responde, las migraciones ya han terminado.
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - savepoint_net

  # Nuevo contenedor para los Jobs de Redis
  queue:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: savepoint_queue
    restart: unless-stopped
    working_dir: /app
    # Ejecuta el worker en lugar de PHP-FPM
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    # Ver el comentario en "app" sobre por qué DB_*/REDIS_HOST no van aquí
    # como "environment:" del contenedor.
    environment:
      ROLE: queue
    volumes:
      - ./backend:/app
      - ./.env:/root.env:ro
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - savepoint_net

  nginx:
    image: nginx:alpine
    container_name: savepoint_web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8081}:8081"
      - "${HTTPS_PORT:-8043}:8043"
    volumes:
      - ./backend:/app
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - savepoint_net

volumes:
  postgres_data:
  redis_data:

networks:
  savepoint_net:
    driver: bridge