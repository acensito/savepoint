services:
  postgres:
    image: postgres:16-alpine
    container_name: savepoint_db
    restart: unless-stopped
    # Lee las credenciales de base de datos directamente desde tu .env de Laravel
    env_file:
      - ./backend/.env
    environment:
      # Mantenemos estas como fallback por si el .env no carga a tiempo en el arranque inicial
      POSTGRES_DB: ${DB_DATABASE:-savepoint}
      POSTGRES_USER: ${DB_USERNAME:-savepoint}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secreto123}
    ports:
      # Cerrado al exterior: Solo accesible desde localhost (tu PC)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-savepoint}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - savepoint_net

  redis:
    image: redis:7-alpine
    container_name: savepoint_redis
    restart: unless-stopped
    ports:
      # Cerrado al exterior: Solo accesible desde localhost
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - savepoint_net

  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: savepoint_app
    restart: unless-stopped
    working_dir: /app
    # Carga todas las variables de entorno de Laravel directamente
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - savepoint_net

  # Nuevo contenedor para los Jobs de Redis
  queue:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: savepoint_queue
    restart: unless-stopped
    working_dir: /app
    # Ejecuta el worker en lugar de PHP-FPM
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - savepoint_net

  nginx:
    image: nginx:alpine
    container_name: savepoint_web
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "8043:8043"
    volumes:
      - ./backend:/app
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - savepoint_net

volumes:
  postgres_data:
  redis_data:

networks:
  savepoint_net:
    driver: bridge