services:
  postgres:
    image: postgres:16-alpine
    container_name: savepoint_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-savepoint}
      POSTGRES_USER: ${DB_USERNAME:-savepoint}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secreto123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-savepoint}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - savepoint_net

  redis:
    image: redis:7-alpine
    container_name: savepoint_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - savepoint_net

  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: savepoint_app
    restart: unless-stopped
    working_dir: /app
    environment:
      - APP_NAME=SavePoint
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=http://localhost
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-savepoint}
      - DB_USERNAME=${DB_USERNAME:-savepoint}
      - DB_PASSWORD=${DB_PASSWORD:-secreto123}
      - CACHE_DRIVER=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=redis
      - QUEUE_DRIVER=redis
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - savepoint_net

  nginx:
    image: nginx:alpine
    container_name: savepoint_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/app
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - savepoint_net

volumes:
  postgres_data:
  redis_data:

networks:
  savepoint_net:
    driver: bridge